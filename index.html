<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C শেখার সাইট (C Learning Site)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:sans-serif;background:#f4f6fb;margin:0;padding:20px}
  .box{max-width:380px;margin:40px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0002;text-align:center}
  input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
  button{width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:16px}
  button.alt{background:#e5e7eb;color:#111}
  button.guest{background:#059669}
  #msg{color:#d93025;min-height:1.4em;font-size:14px}
  hr{border:0;border-top:1px solid #ddd;margin:14px 0}
</style>
</head>
<body>
<div class="box">
  <h1>C শেখার সাইট<br><small>(C Learning Site)</small></h1>

  <div id="authView">
    <input id="email" type="email" placeholder="ইমেইল (Email)">
    <input id="password" type="password" placeholder="পাসওয়ার্ড (Password), কমপক্ষে ৬ অক্ষর">
    <button id="loginBtn">লগইন (Login)</button>
    <button id="signupBtn" class="alt">নতুন অ্যাকাউন্ট খোলো (Create Account)</button>
    <hr>
    <button id="guestBtn" class="guest">অতিথি হিসেবে ঢোকো (Continue as Guest)</button>
  </div>

  <div id="homeView" hidden>
    <p id="welcome"></p>
    <p>এখানে C প্রোগ্রামিং শেখা যাবে। (Learn C programming here.)</p>
    <button id="logoutBtn" class="alt">লগআউট (Logout)</button>
  </div>

  <p id="msg"></p>
</div>

<script>
const db = window.supabase.createClient(
  "https://vodkjzlangbnytithqbw.supabase.co",
  "sb_publishable_ydN2rXq3y4LkMWPXOA7KcQ_6c9CCF58"
);
const $ = id => document.getElementById(id);
const say = t => $("msg").textContent = t;

function render(user){
  $("authView").hidden = !!user;
  $("homeView").hidden = !user;
  if(user){
    $("welcome").textContent = user.is_anonymous
      ? "স্বাগতম, অতিথি (Welcome, Guest)"
      : "স্বাগতম (Welcome), " + user.email;
  }
}

function getCreds(){
  const email = $("email").value.trim();
  const password = $("password").value;
  if(!email || !password){
    say("ইমেইল ও পাসওয়ার্ড দাও (Enter email and password)");
    return null;
  }
  return { email, password };
}

$("signupBtn").onclick = async () => {
  say("");
  const c = getCreds(); if(!c) return;
  const { error } = await db.auth.signUp(c);
  say(error ? "সমস্যা (Error): " + error.message
            : "অ্যাকাউন্ট হয়েছে। ইমেইলের লিংকে চাপ দাও। (Account created. Check your email.)");
};

$("loginBtn").onclick = async () => {
  say("");
  const c = getCreds(); if(!c) return;
  const { error } = await db.auth.signInWithPassword(c);
  if(error) say("সমস্যা (Error): " + error.message);
};

$("guestBtn").onclick = async () => {
  say("");
  const { error } = await db.auth.signInAnonymously();
  if(error) say("সমস্যা (Error): " + error.message);
};

$("logoutBtn").onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_e, session) => render(session ? session.user : null));
db.auth.getSession().then(({data}) => render(data.session ? data.session.user : null));
</script>
</body>
</html>
