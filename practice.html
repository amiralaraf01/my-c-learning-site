abs:a=>Math.abs(nv(a[0]))|0,fabs:M1(Math.abs),sqrt:M1(Math.sqrt),floor:M1(Math.floor),ceil:M1(Math.ceil),sin:M1(Math.sin),cos:M1(Math.cos),tan:M1(Math.tan),log:M1(Math.log),exp:M1(Math.exp),pow:a=>new F(Math.pow(nv(a[0]),nv(a[1])))};
function call(n,a,l){if(B[n])return B[n](a,l);const f=FN[n];if(!f)throw new CErr("'"+n+"' ফাংশন পাওয়া যায়নি",l);

if(++depth>600){depth=0;throw new CErr("রিকার্সন অনেক গভীর হয়ে গেছে",l)}
const s=new Sc(G);f.ps.forEach((q,i)=>s.def(q.n,{t:q.t,v:q.arr?a[i]:coerce(q.t,a[i])}));

let G;
function mk(ds,t,init){const a=[];a.t=t;for(let i=0;i<ds[0];i++)a[i]=ds.length>1?mk(ds.slice(1),t,init&&init[i]):coerce(t,init&&init[i]!==undefined?init[i]:0);return a}
function parse(T){let p=0;const funcs={},globals=[],GR=[["||"],["&&"],["|"],["^"],["&"],["==","!="],["<","<=",">",">="],["<<",">>"],["+","-"],["*","/","%"]];
const nx=()=>T[p++],ln=()=>(T[p]||T[p-1]||{ln:1}).ln,isO=v=>T[p]&&T[p].t=="op"&&T[p].v==v,eat=v=>{if(isO(v)){p++;return true}return false};
const ex=v=>{if(!eat(v))throw new CErr("'"+v+"' দরকার"+(T[p]?" ('"+T[p].v+"'-এর আগে)":" (কোডের শেষে)"),ln())};
const isT=()=>T[p]&&T[p].t=="id"&&KW.has(T[p].v);
const typ=()=>{let b="i";while(isT()){const w=nx().v;if(w=="float"||w=="double")b="f";else if(w=="char")b="c";else if(w=="void")b="v"}return b};
const noLv=l=>new CErr("এখানে ভ্যারিয়েবল দরকার",l);
function asg(){const l=ln(),a=tern();const t=T[p];if(t&&t.t=="op"&&["=","+=","-=","*=","/=","%=","<<=",">>="].includes(t.v)){p++;if(!a.lv)throw noLv(l);const o=t.v,r=asg();return e=>{const q=a.lv(e);q.set(o=="="?r(e):ar(o.slice(0,-1),q.get(),r(e),l));return q.get()}}return a}
function tern(){const c=bin(0);if(eat("?")){const a=asg();ex(":");const b=tern();return e=>nv(c(e))?a(e):b(e)}return c}
function bin(v){if(v==GR.length)return un();let a=bin(v+1);while(T[p]&&T[p].t=="op"&&GR[v].includes(T[p].v)){const o=nx().v,l=ln(),b=bin(v+1),x=a;a=o=="&&"?e=>nv(x(e))&&nv(b(e))?1:0:o=="||"?e=>nv(x(e))||nv(b(e))?1:0:e=>ar(o,x(e),b(e),l)}return a}
function un(){const l=ln();
if(eat("-")){const a=un();return e=>{const v=a(e);return isF(v)?new F(-v.v):-v|0}}
if(eat("+"))return un();
if(eat("!")){const a=un();return e=>nv(a(e))?0:1}
if(eat("~")){const a=un();return e=>~nv(a(e))}
if(isO("++")||isO("--")){const o=nx().v,a=un();if(!a.lv)throw noLv(l);return e=>{const r=a.lv(e);r.set(ar(o[0],r.get(),1,l));return r.get()}}
if(eat("&")){const a=un();return a.lv?e=>a.lv(e):a}
if(isO("(")&&T[p+1]&&T[p+1].t=="id"&&KW.has(T[p+1].v)){p++;const t=typ();ex(")");const a=un();return e=>coerce(t,a(e))}
return post()}
function post(){let a=prim();for(;;){const l=ln();
if(eat("[")){const i=asg();ex("]");const b=a,f=e=>{const A=b(e),k=nv(i(e));if(!Array.isArray(A))throw new CErr("এটা অ্যারে নয়",l);if(k<0||k>=A.length)throw new CErr("অ্যারের সীমার বাইরে: ইনডেক্স "+k+" (বৈধ 0 থেকে "+(A.length-1)+")",l);return[A,k]};
a=Object.assign(e=>{const[A,k]=f(e);return A[k]},{lv:e=>{const[A,k]=f(e);return{get:()=>A[k],set:v=>{A[k]=coerce(A.t||"i",v)}}}})}
else if(isO("++")||isO("--")){const o=nx().v,b=a;if(!b.lv)throw noLv(l);a=e=>{const r=b.lv(e),v=r.get();r.set(ar(o[0],v,1,l));return v}}
else return a}}
function prim(){const t=nx();if(!t)throw new CErr("কোড অসম্পূর্ণ",ln());const l=t.ln;
if(t.t=="num"){const v=t.f?new F(t.v):t.v;return()=>v}
if(t.t=="str")return()=>t.v;
if(t.t=="id"){if(isO("(")){p++;const A=[];if(!eat(")")){do A.push(asg());while(eat(","));ex(")")}return e=>call(t.v,A.map(a=>a(e)),l)}
const nm=t.v;return Object.assign(e=>e.get(nm,l).v,{lv:e=>{const r=e.get(nm,l);return{get:()=>r.v,set:v=>{r.v=coerce(r.t,v)}}}})}
if(t.v=="("){const a=asg();ex(")");return a}
throw new CErr("এখানে '"+t.v+"' আশা করিনি",l)}
function lst(){ex("{");const L=[];while(!isO("}")){L.push(isO("{")?lst():asg());if(!eat(","))break}ex("}");return e=>L.map(f=>f(e))}
function decl(){const t=typ(),L=[];do{let star=false;while(eat("*"))star=true;const nm=nx();if(!nm||nm.t!="id")throw new CErr("নাম দরকার",ln());const dims=[];while(eat("[")){dims.push(isO("]")?null:asg());ex("]")}let init=null;if(eat("="))init=isO("{")?lst():asg();
L.push(e=>{let v=init?init(e):null;if(typeof v=="string")v=[...v].map(c=>c.charCodeAt(0)).concat(0);
if(!dims.length&&!Array.isArray(v)){e.def(nm.v,{t,v:v==null?(t=="f"?new F(0):0):coerce(t,v)});return}
const ds=dims.length?dims.map(d=>d?nv(d(e)):null):[null];if(ds[0]==null)ds[0]=Array.isArray(v)?v.length:0;e.def(nm.v,{t,v:mk(ds,t,v)})})}while(eat(","));ex(";");return e=>L.forEach(f=>f(e))}
const loop=(b,e,l,n)=>{if(++n.c>5e5)throw new CErr("অসীম লুপ মনে হচ্ছে",l);try{b(e)}catch(x){if(x instanceof Brk)return true;if(!(x instanceof Cnt))throw x}};
function blk(){ex("{");const L=[];while(!isO("}")){if(!T[p])throw new CErr("'}' দরকার (কোডের শেষে)",ln());L.push(st())}p++;return e=>{const s=new Sc(e);for(const f of L)f(s)}}
function st(){const l=ln();if(isO("{"))return blk();if(eat(";"))return()=>{};if(isT())return decl();
const w=T[p]&&T[p].t=="id"?T[p].v:"";
if(w=="if"){p++;ex("(");const c=asg();ex(")");const a=st();let b=null;if(T[p]&&T[p].v=="else"){p++;b=st()}return e=>{if(nv(c(e)))a(e);else if(b)b(e)}}
if(w=="while"){p++;ex("(");const c=asg();ex(")");const b=st();return e=>{const n={c:0};while(nv(c(e)))if(loop(b,e,l,n))break}}
if(w=="do"){p++;const b=st();if(!T[p]||T[p].v!="while")throw new CErr("do-এর শেষে while দরকার",l);p++;ex("(");const c=asg();ex(")");ex(";");return e=>{const n={c:0};do{if(loop(b,e,l,n))break}while(nv(c(e)))}}
if(w=="for"){p++;ex("(");let i=null;if(isT())i=decl();else if(!eat(";")){const x=asg();ex(";");i=x}const c=isO(";")?null:asg();ex(";");const s=isO(")")?null:asg();ex(")");const b=st();
return e=>{const q=new Sc(e),n={c:0};if(i)i(q);while(!c||nv(c(q))){if(loop(b,q,l,n))break;if(s)s(q)}}}
if(w=="break"){p++;ex(";");return()=>{throw new Brk}}
if(w=="continue"){p++;ex(";");return()=>{throw new Cnt}}
if(w=="return"){p++;let v=null;if(!isO(";"))v=asg();ex(";");return e=>{throw new Ret(v?v(e):0)}}
if(w=="switch"){p++;ex("(");const c=asg();ex(")");ex("{");const cs=[];

return e=>{const x=nv(c(e));let i=cs.findIndex(k=>k.v&&nv(k.v(e))==x);if(i<0)i=cs.findIndex(k=>!k.v);if(i<0)return;const s=new Sc(e);try{for(let j=i;j<cs.length;j++)for(const f of cs[j].b)f(s)}catch(z){if(!(z instanceof Brk))throw z}}}
const x=asg();ex(";");return x}
while(p<T.length){const s=p,t=typ();const nm=nx();if(!nm||nm.t!="id")throw new CErr("এখানে ফাংশন বা ভ্যারিয়েবলের নাম দরকার",ln());
if(isO("(")){p++;const ps=[];if(!eat(")")){do{if(T[p]&&T[p].v=="void"&&T[p+1]&&T[p+1].v==")"){p++;break}const pt=typ();let arr=false;while(eat("*"))arr=true;const pn=nx();while(eat("[")){if(!isO("]"))asg();ex("]");arr=true}ps.push({n:pn.v,t:pt,arr})}while(eat(","));ex(")")}funcs[nm.v]={ps,rt:t,body:blk()}}
else{p=s;globals.push(decl())}}
return{funcs,globals}}
function runC(src,ask){OUT="";INP="";depth=0;ASK=ask;FN=parse(lex(src));const P=FN;FN=P.funcs;G=new Sc(null);P.globals.forEach(f=>f(G));if(!FN.main)throw new CErr("main() ফাংশন পাওয়া যায়নি",1);call("main",[],1);return OUT}
